name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          IMAP_HOST: mail.test.local
          IMAP_USER: test-imap-user
          IMAP_PASSWORD: test-imap-password
          SMTP_HOST: mail.test.local
          SMTP_USER: test-smtp-user
          SMTP_PASSWORD: test-smtp-password
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./ci-test.db
        run: python -m pytest tests -q

      - name: Prepare SSH key
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s' "${{ secrets.VM_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

          ssh-keygen -y -f ~/.ssh/vm_key > /dev/null

          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          set -e

          ssh -i ~/.ssh/vm_key -o IdentitiesOnly=yes "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" << 'EOF'
            set -e

            cd /opt/vip-catamaran

            git pull --ff-only origin main

            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            sudo -n systemctl restart vip-catamaran
            sudo -n systemctl status vip-catamaran --no-pager

            sleep 5
            curl --fail --silent --show-error http://127.0.0.1:8000 > /dev/null
          EOF
